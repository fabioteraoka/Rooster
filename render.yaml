# Render Blueprint Specification for Impacto Aviation Roster
# Deploy as a Static Site (SPA) with automatic URL rewriting to /index.html
services:
  - type: web
    name: impacto-aviation-roster
    env: static
    buildCommand: npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # SPA rewrite rule: send all non-asset routes to index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Firebase Public Web SDK variables (Optionally configured in Render Dashboard)
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
