    <text x="16" y="26" fill="#64748b" font-size="11" font-weight="600">Total no Efetivo</text>
    <text x="16" y="60" fill="#0f172a" font-size="28" font-weight="bold">30</text>
    <text x="16" y="76" fill="#059669" font-size="10" font-weight="600">✓ 5 Bases Operacionais</text>

    <!-- Card 2: Vencidos (Vermelho) -->
    <rect x="185" y="0" width="170" height="88" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1"/>
