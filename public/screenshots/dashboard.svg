  <text x="998" y="38" fill="#065f46" font-size="10" font-weight="bold">Nuvem Conectada</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="220" height="616" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
