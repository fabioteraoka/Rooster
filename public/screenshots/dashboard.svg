    <text x="90" y="76" fill="#475569" font-size="11" font-weight="bold">NOME DO MECÂNICO</text>
    <text x="320" y="76" fill="#475569" font-size="11" font-weight="bold">BASE</text>
    <text x="400" y="76" fill="#475569" font-size="11" font-weight="bold">CANAC</text>
    <text x="490" y="76" fill="#475569" font-size="11" font-weight="bold">CHT VENCIMENTO</text>
    <text x="650" y="76" fill="#475569" font-size="11" font-weight="bold">STATUS CURSOS</text>
    <text x="810" y="76" fill="#475569" font-size="11" font-weight="bold">AÇÃO</text>

    <!-- Row 1 -->
    <line x1="20" y1="118" x2="910" y2="118" stroke="#f1f5f9" stroke-width="1"/>
    <text x="32" y="106" fill="#0f172a" font-size="11" font-weight="600">MEC-001</text>
    <text x="90" y="106" fill="#0f172a" font-size="11" font-weight="bold">Ademir Santana Junior</text>
    <text x="320" y="106" fill="#0284c7" font-size="11" font-weight="600">REC</text>
    <text x="400" y="106" fill="#475569" font-size="11" font-mono="true">138942</text>
    <text x="490" y="106" fill="#059669" font-size="11">2027-04-30 (Em dia)</text>
    <rect x="650" y="93" width="90" height="20" rx="4" fill="#dcfce7"/>
    <text x="662" y="107" fill="#15803d" font-size="10" font-weight="bold">18 Em Dia</text>
    <text x="810" y="106" fill="#0284c7" font-size="11" font-weight="bold">Ver Ficha →</text>

    <!-- Row 2 -->
    <line x1="20" y1="150" x2="910" y2="150" stroke="#f1f5f9" stroke-width="1"/>
    <text x="32" y="138" fill="#0f172a" font-size="11" font-weight="600">MEC-005</text>
    <text x="90" y="138" fill="#0f172a" font-size="11" font-weight="bold">Claudio Jair Ferreira</text>
    <text x="320" y="138" fill="#0284c7" font-size="11" font-weight="600">REC</text>
    <text x="400" y="138" fill="#475569" font-size="11" font-mono="true">119842</text>
    <text x="490" y="138" fill="#e11d48" font-size="11" font-weight="bold">2026-01-31 (Vencida)</text>
    <rect x="650" y="125" width="115" height="20" rx="4" fill="#ffe4e6"/>
    <text x="660" y="139" fill="#9f1239" font-size="10" font-weight="bold">1 Vencido (Doutr.)</text>
    <text x="810" y="138" fill="#0284c7" font-size="11" font-weight="bold">Ver Ficha →</text>

    <!-- Row 3 -->
    <line x1="20" y1="182" x2="910" y2="182" stroke="#f1f5f9" stroke-width="1"/>
    <text x="32" y="170" fill="#0f172a" font-size="11" font-weight="600">MEC-011</text>
    <text x="90" y="170" fill="#0f172a" font-size="11" font-weight="bold">Franco Ferreira Ramos</text>
    <text x="320" y="170" fill="#0284c7" font-size="11" font-weight="600">REC</text>
    <text x="400" y="170" fill="#475569" font-size="11" font-mono="true">142109</text>
    <text x="490" y="170" fill="#059669" font-size="11">2027-11-30 (Em dia)</text>
    <rect x="650" y="157" width="115" height="20" rx="4" fill="#fff7ed"/>
    <text x="660" y="171" fill="#9a3412" font-size="10" font-weight="bold">1 Alerta (≤ 30d)</text>
    <text x="810" y="170" fill="#0284c7" font-size="11" font-weight="bold">Ver Ficha →</text>
