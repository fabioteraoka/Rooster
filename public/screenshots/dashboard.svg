    <text x="486" y="80" fill="#0f172a" font-size="12" font-weight="bold">✈️ Boeing 737 NG/MAX</text>
    <text x="486" y="98" fill="#059669" font-size="11" font-weight="600">12 Aptos • 1 Pendência</text>

    <!-- Fleet Item 4 -->
