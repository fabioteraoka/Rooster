  <text x="44" y="103" fill="#ffffff" font-size="12" font-weight="600">📊 Dashboard</text>
  <!-- Nav items -->
  <text x="44" y="139" fill="#475569" font-size="12" font-weight="500">📋 Lista de Designação A4</text>
  <text x="44" y="175" fill="#475569" font-size="12" font-weight="500">📑 Relatório do Roster</text>
  <text x="44" y="211" fill="#475569" font-size="12" font-weight="500">⚠️ Conferência de Frota</text>
  <text x="44" y="247" fill="#475569" font-size="12" font-weight="500">👥 Pessoas &amp; Mecânicos</text>
  <text x="44" y="283" fill="#475569" font-size="12" font-weight="500">🪪 Ficha do Mecânico</text>
  <text x="44" y="319" fill="#475569" font-size="12" font-weight="500">🏅 Licenças ANAC/FAA</text>
  <text x="44" y="355" fill="#475569" font-size="12" font-weight="500">📚 Treinamentos</text>
  <text x="44" y="391" fill="#475569" font-size="12" font-weight="500">⚙️ Motores Habilitados</text>
  <text x="44" y="427" fill="#475569" font-size="12" font-weight="500">🌐 Matrizes de Qualificação</text>
  <text x="44" y="463" fill="#475569" font-size="12" font-weight="500">💾 Importar / Exportar</text>
