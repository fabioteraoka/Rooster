<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="1200" height="680" rx="16" fill="#f8fafc"/>
  
  <!-- App TopBar -->
  <rect width="1200" height="64" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="#082f49"/>
  <text x="40" y="37" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">IA</text>
  <text x="68" y="31" fill="#0f172a" font-size="13" font-weight="bold">IMPACTO AVIATION</text>
  <text x="68" y="46" fill="#64748b" font-size="10">Roster &amp; Designação Técnica • RBAC 145</text>

  <!-- Filter Bar in Header -->
  <rect x="280" y="18" width="300" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="300" y="38" fill="#94a3b8" font-size="11">🔍 Buscar mecânico, CANAC, licença ou frota... (/)</text>
  
  <rect x="600" y="18" width="160" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="615" y="38" fill="#0f172a" font-size="11" font-weight="600">Base: TOTAL (Todas)</text>

  <rect x="780" y="18" width="170" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="795" y="38" fill="#0f172a" font-size="11" font-weight="600">Ref: 15/10/2026 (Audit)</text>

  <!-- Sync status badge -->
