<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <!-- Window Background -->
  <rect width="1200" height="680" rx="16" fill="#f8fafc"/>

  <!-- Top bar preview -->
  <rect width="1200" height="48" fill="#082f49"/>
  <text x="24" y="29" fill="#ffffff" font-size="13" font-weight="bold">IMPACTO AVIATION • IMPORTAÇÃO, EXPORTAÇÃO &amp; PAINEL DE CONFERÊNCIA PÓS-IMPORTAÇÃO</text>

  <!-- Container -->
  <g transform="translate(60, 68)">
    <!-- Card 1: Import Upload Area -->
    <rect x="0" y="0" width="1080" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Drag drop box -->
    <rect x="24" y="20" width="600" height="110" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,4"/>
    <text x="324" y="60" fill="#0c4a6e" font-size="13" font-weight="bold" text-anchor="middle">📂 Arraste seu arquivo oficial ou clique para selecionar</text>
    <text x="324" y="80" fill="#64748b" font-size="11" text-anchor="middle">Suporta arquivo oficial JSON (.json) ou Planilha Excel (.xlsx) de 12 abas</text>
    <rect x="234" y="94" width="180" height="24" rx="4" fill="#082f49"/>
    <text x="324" y="110" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">Escolher Arquivo do Computador</text>

    <!-- Mode Selector Right -->
    <g transform="translate(650, 20)">
      <text x="0" y="18" fill="#0f172a" font-size="12" font-weight="bold">Modo de Gravação:</text>
      
      <!-- Radio 1: Substituir tudo -->
      <rect x="0" y="30" width="400" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="16" cy="47" r="6" fill="#2563eb"/>
      <circle cx="16" cy="47" r="2.5" fill="#ffffff"/>
      <text x="32" y="51" fill="#1e3a8a" font-size="11" font-weight="bold">Substituir tudo (Recomendado na carga oficial)</text>

      <!-- Radio 2: Mesclar -->
      <rect x="0" y="70" width="400" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
      <circle cx="16" cy="87" r="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="32" y="91" fill="#475569" font-size="11">Mesclar / Atualizar (Upsert por chave primária ID)</text>
    </g>

    <!-- Card 2: Conference Panel (Painel de Conferência pós-importação) -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="1080" height="420" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      
      <!-- Green Success Bar -->
      <rect x="0" y="0" width="1080" height="46" rx="12" fill="#047857"/>
      <text x="24" y="28" fill="#ffffff" font-size="13" font-weight="bold">✓ Carga Concluída com Sucesso: 1.054 Registros Processados em Transação Tudo-ou-Nada</text>
      <text x="920" y="28" fill="#a7f3d0" font-size="11" font-weight="bold">100% Homologado</text>

      <!-- Comparison Metrics Grid -->
      <g transform="translate(24, 60)">
        <text x="0" y="18" fill="#0f172a" font-size="12" font-weight="bold">Comparativo Esperado × Gravado por Tabela Relacional:</text>

        <!-- Metric 1: Pessoas -->
        <rect x="0" y="30" width="160" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="12" y="48" fill="#64748b" font-size="10" font-weight="600">PESSOAS</text>
        <text x="12" y="74" fill="#0f172a" font-size="18" font-weight="bold">30 / 30</text>
        <text x="110" y="74" fill="#059669" font-size="11" font-weight="bold">✓ 100%</text>

        <!-- Metric 2: Licenças -->
        <rect x="174" y="30" width="160" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="186" y="48" fill="#64748b" font-size="10" font-weight="600">LICENÇAS (ANAC/FAA)</text>
        <text x="186" y="74" fill="#0f172a" font-size="18" font-weight="bold">30 / 30</text>
        <text x="284" y="74" fill="#059669" font-size="11" font-weight="bold">✓ 100%</text>

        <!-- Metric 3: Treinamentos -->
        <rect x="348" y="30" width="160" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="360" y="48" fill="#64748b" font-size="10" font-weight="600">TREINAMENTOS</text>
        <text x="360" y="74" fill="#0f172a" font-size="18" font-weight="bold">347 / 347</text>
        <text x="458" y="74" fill="#059669" font-size="11" font-weight="bold">✓ 100%</text>

        <!-- Metric 4: Motores -->
        <rect x="522" y="30" width="160" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="534" y="48" fill="#64748b" font-size="10" font-weight="600">TREINAM. MOTOR</text>
        <text x="534" y="74" fill="#0f172a" font-size="18" font-weight="bold">112 / 112</text>
        <text x="632" y="74" fill="#059669" font-size="11" font-weight="bold">✓ 100%</text>

        <!-- Metric 5: Designações -->
        <rect x="696" y="30" width="180" height="60" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <text x="708" y="48" fill="#64748b" font-size="10" font-weight="600">DESIGNAÇÕES TOTAIS</text>
        <text x="708" y="74" fill="#0f172a" font-size="18" font-weight="bold">515 / 515</text>
        <text x="818" y="74" fill="#059669" font-size="11" font-weight="bold">✓ 100%</text>
      </g>

      <!-- Audit Sanity Check Box -->
      <g transform="translate(24, 180)">
        <rect x="0" y="0" width="1032" height="150" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
        <text x="16" y="24" fill="#14532d" font-size="12" font-weight="bold">Testes de Sanidade da Auditoria Técnica Oficial:</text>

        <g transform="translate(16, 40)">
          <!-- Test 1 -->
          <text x="0" y="16" fill="#166534" font-size="11">✓ <tspan font-weight="bold">Claudio Jair Ferreira (MEC-005):</tspan> Curso &quot;Doutrinação Regulamentar&quot; vencido em 2026-01-31 (Verificado com sucesso).</text>
          
          <!-- Test 2 -->
          <text x="0" y="40" fill="#166534" font-size="11">✓ <tspan font-weight="bold">Franco Ferreira Ramos (MEC-011):</tspan> Curso &quot;Familiarization ATR-72&quot; vencido em 2023-02-28 (Verificado com sucesso).</text>

          <!-- Test 3 -->
          <text x="0" y="64" fill="#166534" font-size="11">✓ <tspan font-weight="bold">Contagem Base REC:</tspan> Exatamente 7 mecânicos lotados em Recife (Ademir, Claudio, Franco, Gilberto, etc.).</text>

          <!-- Test 4 -->
          <text x="0" y="88" fill="#166534" font-size="11">✓ <tspan font-weight="bold">Catálogo de Cursos &amp; Motores:</tspan> 23 cursos homologados e 12 famílias de motores vinculados sem órfãos.</text>
        </g>
      </g>
    </g>
  </g>
</svg>
