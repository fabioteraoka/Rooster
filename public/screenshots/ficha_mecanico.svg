<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#0f172a; font-family:'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;">
  <!-- Window Background -->
  <rect width="1200" height="680" rx="16" fill="#f8fafc"/>

  <!-- Top bar preview -->
  <rect width="1200" height="48" fill="#082f49"/>
  <text x="24" y="29" fill="#ffffff" font-size="13" font-weight="bold">IMPACTO AVIATION • FICHA TÉCNICA 360° DO COLABORADOR</text>
  <rect x="980" y="10" width="190" height="28" rx="6" fill="#ffffff"/>
  <text x="1000" y="28" fill="#082f49" font-size="11" font-weight="bold">🖨️ Imprimir Ficha Individual</text>

  <!-- Content Container -->
  <g transform="translate(60, 68)">
    <!-- Header Card: Mechanic Info -->
    <rect x="0" y="0" width="1080" height="110" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    
    <!-- Avatar badge -->
    <rect x="24" y="20" width="70" height="70" rx="35" fill="#0c4a6e"/>
    <text x="59" y="63" fill="#ffffff" font-size="24" font-weight="bold" text-anchor="middle">AS</text>

    <!-- Details -->
    <text x="110" y="42" fill="#0f172a" font-size="18" font-weight="bold">Ademir Santana Junior</text>
    <rect x="330" y="26" width="70" height="20" rx="4" fill="#0284c7"/>
    <text x="365" y="40" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">MEC-001</text>
    <rect x="410" y="26" width="60" height="20" rx="4" fill="#dcfce7"/>
    <text x="440" y="40" fill="#15803d" font-size="10" font-weight="bold" text-anchor="middle">ATIVO</text>

    <text x="110" y="66" fill="#475569" font-size="11">CANAC: <tspan font-weight="bold" fill="#0f172a">138942</tspan> • Base Principal: <tspan font-weight="bold" fill="#0284c7">REC (Recife)</tspan> • Categoria: <tspan font-weight="bold">Mecânico de Manutenção de Linha</tspan></text>
    <text x="110" y="86" fill="#475569" font-size="11">Habilitações ANAC: <tspan font-weight="bold" fill="#059669">CEL / GMP / AVI</tspan> • Licença FAA: <tspan font-weight="bold" fill="#0284c7">A&amp;P 4198231</tspan> • Responsável por Equipe: <tspan font-weight="bold">SIM</tspan></text>

    <!-- Grid Columns -->
    <!-- Left Column: Licenças e Motores -->
    <g transform="translate(0, 126)">
      <!-- Licenses Box -->
      <rect x="0" y="0" width="340" height="210" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="340" height="38" rx="12" fill="#f8fafc"/>
      <text x="16" y="24" fill="#082f49" font-size="12" font-weight="bold">🏅 Licenças Técnicas ANAC &amp; FAA</text>

      <g transform="translate(16, 50)">
        <text x="0" y="16" fill="#0f172a" font-size="11" font-weight="bold">CHT Célula (CEL):</text>
        <text x="210" y="16" fill="#059669" font-size="11" font-weight="bold">30/04/2027 (Em dia)</text>

        <text x="0" y="44" fill="#0f172a" font-size="11" font-weight="bold">CHT Grupo Moto-Propulsor (GMP):</text>
        <text x="210" y="44" fill="#059669" font-size="11" font-weight="bold">30/04/2027 (Em dia)</text>

        <text x="0" y="72" fill="#0f172a" font-size="11" font-weight="bold">CHT Aviônicos (AVI):</text>
        <text x="210" y="72" fill="#059669" font-size="11" font-weight="bold">30/04/2027 (Em dia)</text>

        <text x="0" y="100" fill="#0f172a" font-size="11" font-weight="bold">FAA Airframe &amp; Powerplant:</text>
        <text x="210" y="100" fill="#0284c7" font-size="11" font-weight="bold">4198231 (Válida)</text>

        <text x="0" y="128" fill="#0f172a" font-size="11" font-weight="bold">Exame Médico Aeronáutico (CMA):</text>
        <text x="210" y="128" fill="#059669" font-size="11" font-weight="bold">15/01/2028 (Em dia)</text>
      </g>

      <!-- Engines Box -->
      <rect x="0" y="226" width="340" height="230" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="226" width="340" height="38" rx="12" fill="#f8fafc"/>
      <text x="16" y="250" fill="#082f49" font-size="12" font-weight="bold">⚙️ Famílias de Motores Homologados</text>

      <g transform="translate(16, 276)">
        <rect x="0" y="0" width="308" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="18" fill="#15803d" font-size="10" font-weight="bold">CFM International CFM56-5B / CFM56-7B</text>

        <rect x="0" y="34" width="308" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="52" fill="#15803d" font-size="10" font-weight="bold">IAE V2500-A5 Series (Airbus A320)</text>

        <rect x="0" y="68" width="308" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="86" fill="#15803d" font-size="10" font-weight="bold">CFM LEAP-1A &amp; LEAP-1B (NEO / MAX)</text>

        <rect x="0" y="102" width="308" height="28" rx="6" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
        <text x="12" y="120" fill="#15803d" font-size="10" font-weight="bold">Pratt &amp; Whitney PW127M / PW150A (ATR)</text>
      </g>
    </g>

    <!-- Right Column: Training History & Renewals -->
    <g transform="translate(360, 126)">
      <rect x="0" y="0" width="720" height="456" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="0" width="720" height="38" rx="12" fill="#f8fafc"/>
      <text x="20" y="24" fill="#082f49" font-size="12" font-weight="bold">📚 Cursos Mandatórios, Frotas &amp; Renovações Rastreáveis</text>

      <!-- Table of courses -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="680" height="26" fill="#f1f5f9" rx="4"/>
        <text x="10" y="17" fill="#475569" font-size="10" font-weight="bold">CURSO / TREINAMENTO</text>
        <text x="280" y="17" fill="#475569" font-size="10" font-weight="bold">REALIZAÇÃO</text>
        <text x="390" y="17" fill="#475569" font-size="10" font-weight="bold">VENCIMENTO</text>
        <text x="510" y="17" fill="#475569" font-size="10" font-weight="bold">STATUS</text>
        <text x="610" y="17" fill="#475569" font-size="10" font-weight="bold">AÇÃO</text>

        <!-- Course 1 -->
        <line x1="0" y1="56" x2="680" y2="56" stroke="#f1f5f9" stroke-width="1"/>
        <text x="10" y="46" fill="#0f172a" font-size="10" font-weight="bold">C-001 • SGSO / SMS - Fatores Humanos</text>
        <text x="280" y="46" fill="#475569" font-size="10">2025-05-10</text>
        <text x="390" y="46" fill="#15803d" font-size="10" font-weight="bold">2027-05-10</text>
        <rect x="510" y="34" width="70" height="18" rx="4" fill="#dcfce7"/>
        <text x="522" y="47" fill="#15803d" font-size="9" font-weight="bold">Em dia</text>
        <text x="610" y="46" fill="#0284c7" font-size="10" font-weight="bold">Renovar ↻</text>

        <!-- Course 2 -->
        <line x1="0" y1="88" x2="680" y2="88" stroke="#f1f5f9" stroke-width="1"/>
        <text x="10" y="78" fill="#0f172a" font-size="10" font-weight="bold">C-002 • Doutrinação Regulamentar RBAC 145</text>
        <text x="280" y="78" fill="#475569" font-size="10">2024-03-15</text>
        <text x="390" y="78" fill="#15803d" font-size="10" font-weight="bold">2027-03-15</text>
        <rect x="510" y="66" width="70" height="18" rx="4" fill="#dcfce7"/>
        <text x="522" y="79" fill="#15803d" font-size="9" font-weight="bold">Em dia</text>
        <text x="610" y="78" fill="#0284c7" font-size="10" font-weight="bold">Renovar ↻</text>

        <!-- Course 3 -->
        <line x1="0" y1="120" x2="680" y2="120" stroke="#f1f5f9" stroke-width="1"/>
        <text x="10" y="110" fill="#0f172a" font-size="10" font-weight="bold">C-005 • EWIS - Electrical Wiring Interconnect</text>
        <text x="280" y="110" fill="#475569" font-size="10">2024-11-20</text>
        <text x="390" y="110" fill="#15803d" font-size="10" font-weight="bold">2026-11-20</text>
        <rect x="510" y="98" width="70" height="18" rx="4" fill="#fff7ed"/>
        <text x="522" y="111" fill="#c2410c" font-size="9" font-weight="bold">≤ 30d</text>
        <text x="610" y="110" fill="#0284c7" font-size="10" font-weight="bold">Renovar ↻</text>

        <!-- Course 4 -->
        <line x1="0" y1="152" x2="680" y2="152" stroke="#f1f5f9" stroke-width="1"/>
        <text x="10" y="142" fill="#0f172a" font-size="10" font-weight="bold">C-007 • Tipo Teórico &amp; Prático Airbus A320</text>
        <text x="280" y="142" fill="#475569" font-size="10">2025-01-15</text>
        <text x="390" y="142" fill="#15803d" font-size="10" font-weight="bold">2028-01-15</text>
        <rect x="510" y="130" width="70" height="18" rx="4" fill="#dcfce7"/>
        <text x="522" y="143" fill="#15803d" font-size="9" font-weight="bold">Em dia</text>
        <text x="610" y="142" fill="#0284c7" font-size="10" font-weight="bold">Renovar ↻</text>

        <!-- Course 5 -->
        <line x1="0" y1="184" x2="680" y2="184" stroke="#f1f5f9" stroke-width="1"/>
        <text x="10" y="174" fill="#0f172a" font-size="10" font-weight="bold">C-009 • Run-Up Engine Ground Test CFM56</text>
        <text x="280" y="174" fill="#475569" font-size="10">2025-08-10</text>
        <text x="390" y="174" fill="#15803d" font-size="10" font-weight="bold">2027-08-10</text>
        <rect x="510" y="162" width="70" height="18" rx="4" fill="#dcfce7"/>
        <text x="522" y="175" fill="#15803d" font-size="9" font-weight="bold">Em dia</text>
        <text x="610" y="174" fill="#0284c7" font-size="10" font-weight="bold">Renovar ↻</text>
      </g>
    </g>
  </g>
</svg>
